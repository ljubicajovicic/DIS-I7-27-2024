name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  build-and-test:
    name: Build and Test All Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all services (compile)
        run: ./gradlew build -x test

      - name: Run all tests
        run: ./gradlew test

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build eureka-server image
        run: docker build --build-arg SERVICE_NAME=eureka-server -t insurance-eureka-server:latest .

      - name: Build config-server image
        run: docker build --build-arg SERVICE_NAME=config-server -t insurance-config-server:latest .

      - name: Build customer-service image
        run: docker build --build-arg SERVICE_NAME=customer-service -t insurance-customer-service:latest .

      - name: Build policy-service image
        run: docker build --build-arg SERVICE_NAME=policy-service -t insurance-policy-service:latest .

      - name: Build claims-service image
        run: docker build --build-arg SERVICE_NAME=claims-service -t insurance-claims-service:latest .

      - name: Build payment-service image
        run: docker build --build-arg SERVICE_NAME=payment-service -t insurance-payment-service:latest .

      - name: Build notification-service image
        run: docker build --build-arg SERVICE_NAME=notification-service -t insurance-notification-service:latest .

      - name: Build gateway image
        run: docker build --build-arg SERVICE_NAME=gateway -t insurance-gateway:latest .